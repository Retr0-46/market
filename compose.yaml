services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '1234'
      POSTGRES_DB: market
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/internal/auth/migrations/init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
      - ./backend/internal/product/migrations/init.sql:/docker-entrypoint-initdb.d/02-product.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - market

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - market

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    environment:
      DATABASE_URL: postgres://postgres:1234@postgres:5432/market?sslmode=disable
      TOKEN_SECRET: ${TOKEN_SECRET:-secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - market

  product-service:
    build:
      context: ./backend
      args:
        SERVICE: product-service
    environment:
      DATABASE_URL: postgres://postgres:1234@postgres:5432/market?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - market

  cart-service:
    build:
      context: ./backend
      args:
        SERVICE: cart-service
    environment:
      REDIS_ADDR: redis:6379
      TOKEN_SECRET: ${TOKEN_SECRET:-secret}
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - market

  frontend:
    build: ./frontend
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
      AUTH_SERVICE_URL: http://auth-service:8080
      CART_SERVICE_URL: http://cart-service:8082
    ports:
      - "3000:3000"
    depends_on:
      - product-service
      - auth-service
      - cart-service
    networks:
      - market

networks:
  market:

volumes:
  postgres_data:
  redis_data:
